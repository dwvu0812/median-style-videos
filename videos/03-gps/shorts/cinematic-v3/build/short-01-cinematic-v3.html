<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Short 1 — Cinematic v3 (morphs, payoff in frame 1, full height)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:"DejaVu Sans",system-ui,sans-serif;color:#fff}
  .wrap{display:flex;flex-direction:column;height:100vh}
  .stage{flex:1;min-height:0;background:#000;overflow:hidden;position:relative}
  svg{width:100%;height:100%;display:block}
  /* CINEMATIC v3 — what changed vs v2:
     - NO full-frame crossfades. Shared elements live in ONE persistent
       <g id="stage"> and MORPH between beats (MORPHS[] in the script:
       explicit from/to tweens, 1.2s ease-out, driven by the wall clock).
       Beat groups hold ONLY non-shared elements (eyebrows, labels); they
       fade (0.45s, blur on the OUTGOING group only) while the picture
       morphs underneath. A label fading is not a slideshow — the picture
       never wholesale-swaps.
     - Beat 2 fixed: the callout arrives WITH the dot (t=0 of the beat),
       not 2s after — the circle arrives as the dot glides in, and the
       "38" counts 0→38 while the dot traces.
     - Frame 1 carries the payoff: "11 km / day" huge + mint at the bottom
       of Beat 1 (a persistent #stage element that morphs into Beat 7's
       giant restatement). A feed viewer learns what the Short is about
       without waiting ~20s.
     - Full vertical height: every beat is composed for 1080×1920 (usable
       band y≈150–1330; captions 1335–1393; nothing below y≈1420). v2's
       compositions were a horizontal band floating in black (top ~25% and
       bottom ~35% empty in every frame).
     - Beat 4 has a camera push-in (viewBox zoom 1.2× on the "11", the one
       worked calculation). Captions live in an HTML overlay (#capOverlay)
       so the zoom does not move them.
     - All motion is LINEAR where the 1fps meter reads it (counters, pins,
       trace dot): ease-out tails read as frozen. */
  .beat{display:block;opacity:0;transition:opacity .45s ease,filter .45s ease;pointer-events:none}
  .beat.active{opacity:1;pointer-events:auto}
  .beat.leaving{filter:blur(3px)}
  .eyebrow{font-size:30px;letter-spacing:10px;fill:#9A9A9A;font-weight:600}
  .math{font-family:"Times New Roman",Georgia,serif;fill:#fff}
  .grey{fill:#9A9A9A}
  .green{fill:#6FCF97}.blue{fill:#7E9BFF}
  .thin{stroke:#fff;stroke-width:2;fill:none}
  .thinG{stroke:#9A9A9A;stroke-width:2;fill:none}
  .fillChar{fill:#1A1A1A}.fillMain{fill:#212120}.fillPanel{fill:#141414}
  /* Entrances: slow blur-in 1.8s ease-out. BUILD stagger f1..f6 at
     0/2/4/6/8/10s — a new element every 2s through the whole beat. */
  .beat.active .f1{animation:blurFade 1.8s cubic-bezier(.22,1,.36,1) both}
  .beat.active .f2{animation:blurFade 1.8s 2s cubic-bezier(.22,1,.36,1) both}
  .beat.active .f3{animation:blurFade 1.8s 4s cubic-bezier(.22,1,.36,1) both}
  .beat.active .f4{animation:blurFade 1.8s 6s cubic-bezier(.22,1,.36,1) both}
  .beat.active .f5{animation:blurFade 1.8s 8s cubic-bezier(.22,1,.36,1) both}
  .beat.active .f6{animation:blurFade 1.8s 10s cubic-bezier(.22,1,.36,1) both}
  @keyframes blurFade{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
  .beat.active .arrive{animation:arriveIn 1.8s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes arriveIn{from{opacity:0;transform:scale(1.06);filter:blur(6px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
  /* Chips slide in at PAGE LOAD (not gated on .active — they live in
     #stage). The export waits 2s before the click, so frame 1 shows the
     settled composition. At the loop-back they fade back in (opacity
     morph), the slide does not re-run. */
  @keyframes slideL{from{transform:translateX(-420px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes slideR{from{transform:translateX(420px);opacity:0}to{transform:translateX(0);opacity:1}}
  .sL{animation:slideL 1.5s cubic-bezier(.22,1,.36,1) both}
  .sR{animation:slideR 1.5s cubic-bezier(.22,1,.36,1) both}
  /* Line drawing: draw 2.5s; drawTrace 4s LINEAR with a 1.2s delay — the
     connector lines draw in sync with the trace dot, which starts tracing
     at beat-local 1.2s (after the 1.2s morph brings it to the line start). */
  .beat.active .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.5s .3s ease-in-out forwards}
  .beat.active .drawTrace{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 4s 1.2s linear forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  /* Fade-out (B4's "38 µs/day" leaves as "11" arrives). */
  .beat.active .fadeOut{animation:fadeOut 1s ease-in forwards}
  @keyframes fadeOut{to{opacity:0}}
  /* Dot build-in (day dots): scale from .4, staggered by inline delay. */
  .beat.active .dotIn{animation:dotIn .8s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes dotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  /* Clock hand: constant speed, linear (physics). Origin set inline. */
  @keyframes spin{to{transform:rotate(360deg)}}
  .beat.active .tickhandFast{animation:spin 6s linear infinite}
  /* Callout breathe: slow 5% scale pulse so Beat 2 keeps moving after
     the trace dot arrives. Applied to a CHILD group — never combine two
     `animation` shorthands on one element. */
  .beat.active .breathe{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  /* Captions: HTML overlay (NOT inside the SVG) so the Beat-4 viewBox
     zoom does not move them. Band y 1335–1393, above the bottom ~400px
     safe zone; nothing below y≈1420. */
  #capOverlay{position:absolute;left:0;right:0;top:1335px;text-align:center;pointer-events:none;z-index:5;transition:opacity .18s ease}
  #capOverlay .capLine{font-size:46px;line-height:58px;color:#fff;font-family:"DejaVu Sans",sans-serif;text-shadow:-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000,0 0 10px #000}
  .controls{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#000}
  button{background:none;border:1px solid #555;color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
  button:hover{border-color:#fff}
  .progress{flex:1;height:2px;background:#222;cursor:pointer}
  .progress i{display:block;height:100%;background:#fff;width:0%}
  .time{font-size:12px;color:#9A9A9A;min-width:90px;text-align:right}
  .hint{font-size:12px;color:#9A9A9A;padding:0 16px 12px;line-height:1.6}
  body.export .controls,body.export .hint{display:none!important}
  body.export .stage{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
  <svg id="stageSvg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <!-- ============ BEAT 1 — SUBTRACT (0.0–8.7s) ============
         Frame 1: chips sliding in, counter starting, marker travelling,
         AND the payoff "11 km / day" huge + mint at the bottom. A feed
         viewer knows what the Short is about without waiting ~20s. -->
    <g class="beat" id="b1">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">THE TUG OF WAR</text>
      <text x="320" y="760" text-anchor="middle" font-size="120" class="math f1">=</text>
      <text x="640" y="760" font-size="56" class="grey f1">µs / day</text>
      <g class="f1">
        <line x1="200" y1="1008" x2="200" y2="1032" stroke="#9A9A9A" stroke-width="2"/>
        <line x1="292" y1="1008" x2="292" y2="1032" stroke="#9A9A9A" stroke-width="2"/>
        <line x1="788" y1="1008" x2="788" y2="1032" stroke="#6FCF97" stroke-width="2"/>
        <line x1="880" y1="1008" x2="880" y2="1032" stroke="#9A9A9A" stroke-width="2"/>
        <text x="200" y="1075" text-anchor="middle" font-size="34" class="grey">−7</text>
        <text x="292" y="1075" text-anchor="middle" font-size="34" class="grey">0</text>
        <text x="788" y="1075" text-anchor="middle" font-size="34" class="green">+38</text>
        <text x="880" y="1075" text-anchor="middle" font-size="34" class="grey">+45</text>
        <text x="140" y="1135" font-size="34" class="grey">µs / day</text>
      </g>
    </g>
    <!-- ============ BEAT 2 — PARTS IN A MILLION (8.7–15.87s) ============
         FIXED (v2's weakest beat): the callout arrives WITH the dot.
         At beat start the circle arrives (1.8s), num38 glides in and
         starts counting 0→38, the dot glides to the line start — three
         things moving from second 0. The trace proper runs 9.9–13.9s
         (4s linear, after the 1.2s morph); the connector lines draw in
         sync (4s linear, 1.2s delay); the callout breathes after. -->
    <g class="beat" id="b2">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">THIRTY-EIGHT PARTS IN A MILLION</text>
      <g class="f1">
        <line x1="100" y1="488" x2="100" y2="512" stroke="#9A9A9A" stroke-width="2"/>
        <line x1="980" y1="488" x2="980" y2="512" stroke="#9A9A9A" stroke-width="2"/>
        <text x="100" y="560" font-size="40" class="grey">0</text>
        <text x="980" y="560" text-anchor="end" font-size="40" class="grey">1,000,000</text>
      </g>
      <g id="callout"><g class="breathe">
        <line x1="106" y1="512" x2="450" y2="700" stroke="#9A9A9A" stroke-width="1.5" class="drawTrace" pathLength="100"/>
        <line x1="118" y1="512" x2="630" y2="700" stroke="#9A9A9A" stroke-width="1.5" class="drawTrace" pathLength="100"/>
        <circle cx="540" cy="900" r="230" fill="#141414" stroke="#6FCF97" stroke-width="3" class="arrive"/>
        <text x="540" y="1010" text-anchor="middle" font-size="40" class="grey">of 1,000,000</text>
      </g></g>
      <text x="540" y="1240" text-anchor="middle" font-size="36" class="grey f3">×26,316 magnification</text>
    </g>
    <!-- ============ BEAT 3 — PHONE NOTICES (15.87–20.14s) ============
         Taller phone (300–1100) to use the vertical height. Clock hand
         spins the whole beat; minutes count 1→4; a signal dot travels
         down the phone's right edge (vertical motion). -->
    <g class="beat" id="b3">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">YOUR PHONE WOULD NOTICE</text>
      <g class="f1">
        <rect x="210" y="300" width="300" height="800" rx="36" fill="#1A1A1A" stroke="#fff" stroke-width="2"/>
        <line x1="330" y1="332" x2="390" y2="332" stroke="#9A9A9A" stroke-width="3"/>
        <line x1="320" y1="1068" x2="400" y2="1068" stroke="#9A9A9A" stroke-width="3"/>
        <circle cx="360" cy="680" r="160" fill="none" stroke="#fff" stroke-width="2"/>
        <line x1="360" y1="520" x2="360" y2="540" stroke="#9A9A9A" stroke-width="3"/>
        <line x1="360" y1="820" x2="360" y2="840" stroke="#9A9A9A" stroke-width="3"/>
        <line x1="200" y1="680" x2="220" y2="680" stroke="#9A9A9A" stroke-width="3"/>
        <line x1="500" y1="680" x2="520" y2="680" stroke="#9A9A9A" stroke-width="3"/>
        <line x1="360" y1="680" x2="360" y2="540" stroke="#6FCF97" stroke-width="5" class="tickhandFast" style="transform-origin:360px 680px"/>
        <circle cx="360" cy="680" r="8" fill="#6FCF97"/>
        <text x="360" y="950" text-anchor="middle" font-size="40" class="green f2">+38 µs</text>
      </g>
      <circle id="signalDot" cx="510" cy="300" r="10" fill="#6FCF97"/>
      <text id="countMin" x="820" y="700" text-anchor="middle" font-size="220" class="math" data-count="1:4:3.8" data-count-at="16.37">1</text>
      <text x="820" y="790" text-anchor="middle" font-size="44" class="grey f1">minutes</text>
    </g>
    <!-- ============ BEAT 4 — TIME BECOMES DISTANCE (20.14–29.69s) ============
         The worked calculation: "11" counts in, the pin travels the road
         leaving a mint trail, the distance counts 0→11.0 km, a vertical
         bar grows on the right in sync. CAMERA: viewBox push-in 1.2× on
         the "11" (beat-local 2–5s), back out 7.5–9s. -->
    <g class="beat" id="b4">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">TIME BECOMES DISTANCE</text>
      <text x="540" y="380" text-anchor="middle" font-size="56" class="grey fadeOut">38 µs / day</text>
      <text id="count11" x="440" y="700" text-anchor="middle" font-size="320" class="math" data-count="0:11:3" data-count-at="20.64">0</text>
      <text x="610" y="700" font-size="72" class="grey f2">km / day</text>
      <rect id="vbar4" x="930" y="1000" width="40" height="0" fill="#6FCF97" opacity="0.85"/>
      <text id="countKm" x="540" y="1120" text-anchor="middle" font-size="54" class="grey" data-count="0:11:7.4" data-count-at="22.14" data-fmt="1dpkm">0.0 km</text>
    </g>
    <!-- ============ BEAT 5 — A WEEK, WRONG CITY (29.69–36.89s) ============
         7 day-dots arrive one by one; error counter 11→77 km; the pin
         morphs in from the road end, then drops on the wrong block.
         The road morphs into the grid's top street (y 1000→1040). -->
    <g class="beat" id="b5">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">LEFT ALONE FOR A WEEK</text>
      <g class="f1">
        <rect x="340" y="300" width="400" height="110" rx="24" fill="#212120" stroke="#7E9BFF" stroke-width="3"/>
        <text x="540" y="370" text-anchor="middle" font-size="54" fill="#fff">≈ 7 miles</text>
      </g>
      <g id="dayDots">
        <g class="dotIn" style="animation-delay:.5s"><circle cx="150" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="150" y="570" text-anchor="middle" font-size="30" class="grey">1</text></g>
        <g class="dotIn" style="animation-delay:1.2s"><circle cx="280" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="280" y="570" text-anchor="middle" font-size="30" class="grey">2</text></g>
        <g class="dotIn" style="animation-delay:1.9s"><circle cx="410" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="410" y="570" text-anchor="middle" font-size="30" class="grey">3</text></g>
        <g class="dotIn" style="animation-delay:2.6s"><circle cx="540" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="540" y="570" text-anchor="middle" font-size="30" class="grey">4</text></g>
        <g class="dotIn" style="animation-delay:3.3s"><circle cx="670" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="670" y="570" text-anchor="middle" font-size="30" class="grey">5</text></g>
        <g class="dotIn" style="animation-delay:4.0s"><circle cx="800" cy="560" r="28" fill="#212120" stroke="#9A9A9A" stroke-width="2"/><text x="800" y="570" text-anchor="middle" font-size="30" class="grey">6</text></g>
        <g class="dotIn" style="animation-delay:4.7s"><circle cx="930" cy="560" r="28" fill="#212120" stroke="#6FCF97" stroke-width="2"/><text x="930" y="570" text-anchor="middle" font-size="30" class="green">7</text></g>
      </g>
      <text id="countErr" x="540" y="830" text-anchor="middle" font-size="200" class="math" data-count="11:77:6.5" data-count-at="30.19" data-fmt="km">11 km</text>
      <text x="540" y="910" text-anchor="middle" font-size="40" class="grey f2">of error after one week</text>
      <g class="f2">
        <line x1="300" y1="980" x2="300" y2="1180" stroke="#9A9A9A" stroke-width="1.5"/>
        <line x1="540" y1="980" x2="540" y2="1180" stroke="#9A9A9A" stroke-width="1.5"/>
        <line x1="780" y1="980" x2="780" y2="1180" stroke="#9A9A9A" stroke-width="1.5"/>
        <line x1="200" y1="1040" x2="880" y2="1040" stroke="#9A9A9A" stroke-width="1.5"/>
        <line x1="200" y1="1120" x2="880" y2="1120" stroke="#9A9A9A" stroke-width="1.5"/>
        <rect x="330" y="1060" width="46" height="46" fill="#212120" stroke="#9A9A9A" stroke-width="1.5"/>
        <rect x="570" y="1060" width="46" height="46" fill="#212120" stroke="#9A9A9A" stroke-width="1.5"/>
        <rect x="450" y="1140" width="46" height="46" fill="#212120" stroke="#9A9A9A" stroke-width="1.5"/>
        <rect x="690" y="1140" width="46" height="46" fill="#212120" stroke="#9A9A9A" stroke-width="1.5"/>
      </g>
      <text x="540" y="1260" text-anchor="middle" font-size="44" class="grey f3">wrong city</text>
    </g>
    <!-- ============ BEAT 6 — A MONTH, WRONG COUNTRY (36.89–40.54s) ============
         30 dots in 3 waves (JS-built); counter 77→330 km; "wrong city"
         struck through, replaced by "wrong country". The pin travels the
         road again (road morphs y 1040→1150). -->
    <g class="beat" id="b6">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">LEFT ALONE FOR A MONTH</text>
      <g id="monthDots"></g>
      <text id="countErr2" x="540" y="860" text-anchor="middle" font-size="200" class="math" data-count="77:330:3.6" data-count-at="36.89" data-fmt="km">77 km</text>
      <text x="540" y="960" text-anchor="middle" font-size="48" class="grey f1">wrong city</text>
      <line x1="380" y1="955" x2="700" y2="955" stroke="#6FCF97" stroke-width="3" class="draw" pathLength="100" style="animation-delay:1s"/>
      <text x="540" y="1040" text-anchor="middle" font-size="54" class="green f2">wrong country</text>
    </g>
    <!-- ============ BEAT 7 — THE LIE + LOOP (40.54–47.568s) ============
         The payoff morphs back to the centre, huge ("11" + "km / day" are
         the SAME #stage elements as Beat 1's bottom payoff — they glide
         up and scale up). At beat-local 5.0s the loop-back morph returns
         every shared element to its Beat-1 state, so the loop restarts on
         the same picture — a morph, not a crossfade to a duplicated group. -->
    <g class="beat" id="b7">
      <text x="540" y="210" text-anchor="middle" class="eyebrow f1">YOUR PHONE WOULD LIE TO YOU</text>
      <text x="540" y="800" text-anchor="middle" font-size="44" class="grey f2">every single day</text>
    </g>
    <!-- ================= #stage — PERSISTENT, MORPHED =================
         These elements survive beat changes; MORPHS[] moves them between
         beats (1.2s ease-out) instead of dissolving the whole picture.
         Beat groups below hold ONLY non-shared elements (eyebrows, labels,
         beat-specific objects) that fade in/out. -->
    <g id="stage">
      <!-- Tug-of-war chips (Beat 1 + loop-back). Slide in at page load. -->
      <g id="chips">
        <g class="sL">
          <rect x="120" y="300" width="330" height="240" rx="24" fill="#212120" stroke="#6FCF97" stroke-width="3"/>
          <text x="285" y="445" text-anchor="middle" font-size="110" class="math green">+45</text>
          <text x="285" y="495" text-anchor="middle" font-size="28" class="grey">µs/day · HEIGHT</text>
        </g>
        <g class="sR">
          <rect x="630" y="300" width="330" height="240" rx="24" fill="#212120" stroke="#7E9BFF" stroke-width="3"/>
          <text x="795" y="445" text-anchor="middle" font-size="110" class="math blue">−7</text>
          <text x="795" y="495" text-anchor="middle" font-size="28" class="grey">µs/day · SPEED</text>
        </g>
        <text x="540" y="450" text-anchor="middle" font-size="110" class="math">−</text>
      </g>
      <!-- The scale line (Beat 1) morphs into the million-line (Beat 2).
           Ticks/labels live in the beat groups (they fade); the line itself
           is shared and morphs. -->
      <line id="scaleLine" x1="140" y1="1020" x2="940" y2="1020" class="thinG"/>
      <!-- Mint trail behind the Beat-2 trace dot (x2 follows the dot). -->
      <line id="traceTrail" x1="100" y1="500" x2="100" y2="500" stroke="#6FCF97" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <!-- The road (Beats 4–7) morphs its y between beats; the trail
           follows the pin. Hidden in Beats 1–3 and in the loop-back. -->
      <line id="road" x1="140" y1="1000" x2="940" y2="1000" class="thin" opacity="0"/>
      <line id="trail" x1="140" y1="1000" x2="140" y2="1000" stroke="#6FCF97" stroke-width="6" stroke-linecap="round" opacity="0"/>
      <!-- The marker (Beat 1) becomes the trace dot (Beat 2): it glides
           to the line start in two legs (up, then left) so it never
           crosses the callout circle, shrinks r 24→12, then traces. -->
      <circle id="markerDot" cx="200" cy="1020" r="24" fill="#6FCF97"/>
      <!-- The one travelling pin (Beats 4–7), positioned by transform. -->
      <g id="pin" transform="translate(140,1000)" opacity="0">
        <circle cx="0" cy="-16" r="24" fill="#6FCF97"/>
        <path d="M -18 0 L 18 0 L 0 40 Z" fill="#6FCF97"/>
      </g>
      <!-- The "38" (Beats 1–2): counts 0→38 in Beat 1, glides into the
           Beat-2 callout and counts 0→38 again with the dot. -->
      <text id="num38" x="480" y="760" text-anchor="middle" font-size="230" class="math">0</text>
      <!-- The payoff (Beats 1 + 7): huge + mint in frame 1 at the bottom,
           morphs into Beat 7's giant centre restatement, morphs back down
           for the loop. Two elements so the "11" and the unit scale
           independently. -->
      <text id="payoffNum" x="430" y="1270" text-anchor="middle" font-size="120" class="math green">11</text>
      <text id="payoffUnit" x="520" y="1270" font-size="56" class="green">km / day</text>
    </g>
  </svg>
  <div id="capOverlay" opacity="0">
    <div class="capLine" id="capL1"></div>
    <div class="capLine" id="capL2"></div>
  </div>
  </div>
  <audio id="vo" src="audio.m4a" preload="auto"></audio>
  <div class="controls">
    <button id="playBtn">Phát</button>
    <button id="restartBtn">Xem lại</button>
    <div class="progress" id="progress"><i id="bar"></i></div>
    <div class="time" id="time">0:00 / 0:48</div>

const EASEOUT=p=>1-Math.pow(1-p,3);

   tx/ty/sx/sy (transform translate/scale, kept in a per-element map).
   Ease: 'out' (default, 1.2s morphs) or 'linear' (travels — an ease-out

const INIT={
  chips:{opacity:1},
  scaleLine:{x1:140,y1:1020,x2:940,y2:1020,opacity:1},
  traceTrail:{x1:100,y1:500,x2:100,y2:500,opacity:0},
  road:{x1:140,y1:1000,x2:940,y2:1000,opacity:0},
  trail:{x1:140,y1:1000,x2:140,y2:1000,opacity:0},
  markerDot:{cx:200,cy:1020,r:24,opacity:1},
  pin:{tx:140,ty:1000,sx:1,sy:1,opacity:0},
  num38:{x:480,y:760,fontSize:230,opacity:1},
  payoffNum:{x:430,y:1270,fontSize:120,opacity:1},
  payoffUnit:{x:520,y:1270,fontSize:56,opacity:1},
};
const TF=new Map(); // element id -> {tx,ty,sx,sy}
function setAttr(el,k,v){
  if(k==='tx'||k==='ty'||k==='sx'||k==='sy'){
    const st=TF.get(el.id)||{tx:0,ty:0,sx:1,sy:1};
    st[k]=v; TF.set(el.id,st);
    el.setAttribute('transform',`translate(${st.tx.toFixed(1)},${st.ty.toFixed(1)}) scale(${st.sx},${st.sy})`);
  } else if(k==='fontSize'){
    el.setAttribute('font-size',v.toFixed(1));
  } else if(k==='opacity'){
    el.setAttribute('opacity',v.toFixed(3));
  } else {
    el.setAttribute(k,v.toFixed(1));
  }
}
function resetToInit(){
  for(const id in INIT){
    const el=document.getElementById(id); if(!el) continue;
    for(const k in INIT[id]) setAttr(el,k,INIT[id][k]);

  TF.set('pin',{tx:140,ty:1000,sx:1,sy:1});

const MORPHS=[
 // ---- B1 -> B2 (at 8.7): the scale becomes the million-line, the marker

 {at:8.7, el:'markerDot', dur:0.6, from:{cx:788,cy:1020,r:24}, to:{cx:788,cy:500,r:24}},
 {at:9.3, el:'markerDot', dur:0.6, from:{cx:788,cy:500,r:24}, to:{cx:100,cy:500,r:12}},
 {at:8.7, el:'num38', dur:1.2, from:{x:480,y:760,fontSize:230,opacity:1}, to:{x:540,y:930,fontSize:150,opacity:1}},
 {at:8.7, el:'chips', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 {at:8.7, el:'payoffNum', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 {at:8.7, el:'payoffUnit', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 // ---- B2 -> B3 (at 15.87): the dot, the 38 and the line fade out.

 {at:15.87, el:'num38', dur:1.2, from:{opacity:1}, to:{opacity:0}},
 {at:15.87, el:'scaleLine', dur:1.2, from:{opacity:1}, to:{opacity:0}},
 {at:15.87, el:'traceTrail', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 // ---- B3 -> B4 (at 20.14): the road appears.
 {at:20.14, el:'road', dur:1.2, from:{opacity:0}, to:{opacity:1}},

 {at:29.69, el:'pin', dur:1.2, from:{tx:940,ty:1000}, to:{tx:700,ty:880}},

 {at:29.69, el:'trail', dur:0.4, from:{opacity:1}, to:{opacity:0}},

 {at:32.19, el:'pin', dur:0.6, from:{tx:700,ty:880}, to:{tx:700,ty:1000}},

 {at:36.89, el:'pin', dur:1.2, from:{tx:700,ty:1000}, to:{tx:140,ty:1150}},
 {at:36.89, el:'road', dur:1.2, from:{x1:200,y1:1040,x2:880,y2:1040}, to:{x1:140,y1:1150,x2:940,y2:1150}},
 // ---- B6 -> B7 (at 40.54): the pin glides to the road start, the road

 {at:40.54, el:'pin', dur:1.2, from:{tx:140,ty:1150}, to:{tx:140,ty:1000}},
 {at:40.54, el:'road', dur:1.2, from:{x1:140,y1:1150,x2:940,y2:1150}, to:{x1:140,y1:1000,x2:940,y2:1000}},
 {at:40.54, el:'payoffNum', dur:1.2, from:{x:430,y:1270,fontSize:120,opacity:0}, to:{x:420,y:700,fontSize:300,opacity:1}},
 {at:40.54, el:'payoffUnit', dur:1.2, from:{x:520,y:1270,fontSize:56,opacity:0}, to:{x:620,y:700,fontSize:84,opacity:1}},

 {at:45.54, el:'payoffNum', dur:1.5, from:{x:420,y:700,fontSize:300,opacity:1}, to:{x:430,y:1270,fontSize:120,opacity:1}},
 {at:45.54, el:'payoffUnit', dur:1.5, from:{x:620,y:700,fontSize:84,opacity:1}, to:{x:520,y:1270,fontSize:56,opacity:1}},
 {at:45.54, el:'chips', dur:1.5, from:{opacity:0}, to:{opacity:1}},
 {at:45.54, el:'scaleLine', dur:1.5, from:{x1:100,y1:500,x2:980,y2:500,opacity:0}, to:{x1:140,y1:1020,x2:940,y2:1020,opacity:1}},
 {at:45.54, el:'markerDot', dur:1.5, from:{cx:980,cy:500,r:12,opacity:0}, to:{cx:788,cy:1020,r:24,opacity:1}},
 {at:45.54, el:'num38', dur:1.5, from:{x:540,y:930,fontSize:150,opacity:0}, to:{x:480,y:760,fontSize:230,opacity:1}},
 {at:45.54, el:'pin', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 {at:45.54, el:'road', dur:0.6, from:{opacity:1}, to:{opacity:0}},
 {at:45.54, el:'trail', dur:0.6, from:{opacity:1}, to:{opacity:0}},

function applyTween(tw,t){
  const p=Math.min(1,Math.max(0,(t-tw.at)/tw.dur));
  const e=tw.ease==='linear'?p:EASEOUT(p);
  const el=document.getElementById(tw.el); if(!el) return;
  for(const k in tw.to){
    const f=tw.from[k];
    setAttr(el,k,f+(tw.to[k]-f)*e);
  }
}
function applyTweens(t){
  for(const tw of MORPHS){
    if(t>=tw.at) applyTween(tw,t);
  }
}
// Build the 30 month-dots (10x3 grid, waves at 0/1/2s, last dot mint).
(function(){
  const NS='http://www.w3.org/2000/svg', g=document.getElementById('monthDots');
  for(let r=0;r<3;r++) for(let c=0;c<10;c++){
    const i=r*10+c, x=140+c*86.67, y=420+r*80;
    const grp=document.createElementNS(NS,'g');
    grp.setAttribute('class','dotIn');
    grp.style.animationDelay=(r*1)+'s';
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('r',22);
    dot.setAttribute('fill', i===29?'#6FCF97':'#212120');
    dot.setAttribute('stroke', i===29?'#6FCF97':'#9A9A9A'); dot.setAttribute('stroke-width',2);
    grp.appendChild(dot); g.appendChild(grp);
  }
})();
let elapsed=0, playing=false, timer=null, rafId=null, currentIdx=-1, currentCap=-1, loopActive=false;
const capOv=document.getElementById('capOverlay'), capL1=document.getElementById('capL1'), capL2=document.getElementById('capL2'),
      bar=document.getElementById('bar'), timeEl=document.getElementById('time'), playBtn=document.getElementById('playBtn'),
      svgEl=document.getElementById('stageSvg');
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function showBeat(i){
  if(i===currentIdx) return;
  const prev=currentIdx;
  currentIdx=i;
  if(prev>=0){
    const oldEl=document.getElementById(BEATS[prev].id);
    oldEl.classList.remove('active'); oldEl.classList.add('leaving');
    setTimeout(()=>oldEl.classList.remove('leaving'),600);
  }
  document.getElementById(BEATS[i].id).classList.add('active');
}
function enterLoop(){
  loopActive=true;
  const b7=document.getElementById('b7'), b1=document.getElementById('b1');
  b7.classList.remove('active'); b7.classList.add('leaving');
  setTimeout(()=>b7.classList.remove('leaving'),600);
  b1.classList.add('active'); // restages Beat 1's entrance as the loop restarts
  currentIdx=0;
}
function showCaption(i){
  if(i===currentCap) return;
  currentCap=i;
  if(i<0){ capOv.style.opacity=0; return; }
  capL1.textContent=CAPTIONS[i].lines[0]||'';
  capL2.textContent=CAPTIONS[i].lines[1]||'';
  capOv.style.opacity=1;
}
function fmtCount(el,v){
  const f=el.dataset.fmt||'int';
  if(f==='1dp') return v.toFixed(1);
  if(f==='km') return Math.round(v)+' km';
  if(f==='1dpkm') return v.toFixed(1)+' km';
  return String(Math.round(v));
}
function updateCounts(t){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const beat=el.closest('.beat');
    if(beat && !beat.classList.contains('active')) return;
    const parts=el.dataset.count.split(':').map(Number);
    const from=parts[0], to=parts[1], dur=parts[2]||3;
    const at=parseFloat(el.dataset.countAt||'0');
    let v;
    if(t<at) v=from;
    else if(t>=at+dur) v=to;
    else v=from+(to-from)*((t-at)/dur); // LINEAR — no ease-out tail
    el.textContent=fmtCount(el,v);
  });
}
/* Is a morph currently animating this element's transform keys? Travel
   code must not fight the morph engine for the same element. */
function morphOwns(elId,t){
  return MORPHS.some(tw=>tw.el===elId && t>=tw.at && t<tw.at+tw.dur &&
    ('tx' in tw.to || 'ty' in tw.to));
}
function setPin(tx,ty){
  const pin=document.getElementById('pin');
  setAttr(pin,'tx',tx); setAttr(pin,'ty',ty);
}
function updateCamera(t){
  // Beat-4 push-in on the "11" (worked calculation): 1.2× over 3s
  // ease-in-out, hold, back out 1.5s. Pure function of t.
  const FULL=[0,0,1080,1920], ZOOM=[90,160,900,1600];
  let v;
  if(t<22.14) v=FULL;
  else if(t<25.14){ const e=EASEINOUT((t-22.14)/3); v=FULL.map((f,i)=>f+(ZOOM[i]-f)*e); }
  else if(t<27.64) v=ZOOM;
  else if(t<29.14){ const e=EASEINOUT((t-27.64)/1.5); v=ZOOM.map((f,i)=>f+(FULL[i]-f)*e); }
  else v=FULL;
  svgEl.setAttribute('viewBox',v.map(n=>n.toFixed(1)).join(' '));
}
function updateMotion(t){
  applyTweens(t);
  updateCounts(t);
  // num38 counts TWICE (data-count is single-window): Beat 1 (0.8–3.8s)
  // and Beat 2 with the dot (8.7–12.7s — starts WITH the beat, so the
  // callout is alive from second 0; the 38→0 reset is masked by the
  // glide). LINEAR.
  const n38=document.getElementById('num38');
  if(t>=0.8 && t<3.8) n38.textContent=String(Math.round(38*((t-0.8)/3)));
  else if(t>=8.7 && t<12.7) n38.textContent=String(Math.round(38*((t-8.7)/4)));
  else if(t>=3.8) n38.textContent='38';
  // B1 marker: -7 -> +45 (0-5s), +45 -> +38 (5-6.5s), then a triangle-wave
  // patrol around +38 at constant 82 px/s. ALL LINEAR. Gated to t<8.7:
  // at 8.7 the morph engine takes the marker over.
  const m1=document.getElementById('markerDot');
  if(t>=0 && t<8.7){
    let x;
    if(t<5) x=200+680*(t/5);
    else if(t<6.5) x=880-92*((t-5)/1.5);
    else { const p=((t-6.5)/2.2)%1; const tri=p<0.25?p*4:p<0.75?2-p*4:p*4-4; x=788+45*tri; }
    m1.setAttribute('cx', x.toFixed(1)); m1.setAttribute('cy','1020'); m1.setAttribute('r','24');
  }
  // B2 trace: the dot traces 0 -> 1,000,000 over 4s LINEAR (9.9-13.9s,
  // after the 1.2s morph brings it to the line start). The mint trail
  // grows behind it. Gated to the trace window: before it the morph
  // owns the dot; after it the dot rests at the line end until B3.
  const tt=document.getElementById('traceTrail');
  if(t>=9.9 && t<15.87){
    const x=100+880*Math.min(1,(t-9.9)/4);
    m1.setAttribute('cx', x.toFixed(1)); m1.setAttribute('cy','500'); m1.setAttribute('r','12');
    tt.setAttribute('x2', x.toFixed(1)); tt.setAttribute('opacity','1');
  } else if(t<8.7){
    tt.setAttribute('opacity','0');
  }
  // B3 signal dot: travels down the phone's right edge (vertical motion).
  const sd=document.getElementById('signalDot');
  if(sd){
    if(t>=15.87 && t<20.14) sd.setAttribute('cy',(300+800*((t-15.87)/4.27)).toFixed(1));
    else sd.setAttribute('cy','300');
  }
  // B4 vertical bar: grows upward in sync with the distance counter.
  const vb=document.getElementById('vbar4');
  if(vb){
    if(t>=20.14 && t<29.69){
      const p=Math.min(1,Math.max(0,(t-22.14)/7.4));
      vb.setAttribute('height',(600*p).toFixed(1));
      vb.setAttribute('y',(1000-600*p).toFixed(1));
    } else { vb.setAttribute('height','0'); vb.setAttribute('y','1000'); }
  }
  // Pin travels (LINEAR). Each travel starts AFTER its morph ends, so
  // the morph engine and the travel code never fight for the pin.
  const pin=document.getElementById('pin'), trail=document.getElementById('trail');
  let pinVisible=false, pinX=140, pinY=1000;
  if(t>=22.14 && t<29.69 && !morphOwns('pin',t)){
    pinX=140+800*((t-22.14)/7.55); pinY=1000; pinVisible=true;
    trail.setAttribute('x1','140'); trail.setAttribute('y1','1000');
    trail.setAttribute('x2',pinX.toFixed(1)); trail.setAttribute('y2','1000');
    trail.setAttribute('opacity','1');
  } else if(t>=38.09 && t<40.54 && !morphOwns('pin',t)){
    pinX=140+800*((t-38.09)/2.45); pinY=1150; pinVisible=true;
    trail.setAttribute('x1','140'); trail.setAttribute('y1','1150');
    trail.setAttribute('x2',pinX.toFixed(1)); trail.setAttribute('y2','1150');
    trail.setAttribute('opacity','1');
  } else if(t>=41.74 && t<45.54 && !morphOwns('pin',t)){
    pinX=140+800*((t-41.74)/3.8); pinY=1000; pinVisible=true;
    trail.setAttribute('x1','140'); trail.setAttribute('y1','1000');
    trail.setAttribute('x2',pinX.toFixed(1)); trail.setAttribute('y2','1000');
    trail.setAttribute('opacity','1');
  } else if(t>=29.69 && t<36.89){
    trail.setAttribute('opacity','0');
  }
  if(pinVisible) setPin(pinX,pinY);
  updateCamera(t);
}
const audioEl=document.getElementById('vo');
let startPerf=null;
function tick(){
  if(startPerf===null) startPerf=performance.now()-elapsed*1000;
  elapsed=(performance.now()-startPerf)/1000;
  if(elapsed>=TOTAL){ pause(); elapsed=TOTAL; }
  if(elapsed>=45.54 && !loopActive) enterLoop();
  if(!loopActive){
    const idx=BEATS.findIndex(s=> elapsed>=s.t0 && elapsed < s.t0+s.dur);
    if(idx>=0) showBeat(idx); // gap between lines: hold the current beat
  }
  const ci=CAPTIONS.findIndex(c=> elapsed>=c.t0 && elapsed < c.t1);
  showCaption(ci);
  updateMotion(elapsed);
  bar.style.width=(elapsed/TOTAL*100)+'%';
  timeEl.textContent=fmt(elapsed)+' / '+fmt(TOTAL);
}
function raf(){
  if(!playing) return;
  elapsed=(performance.now()-startPerf)/1000;
  if(elapsed<TOTAL) updateMotion(elapsed);
  rafId=requestAnimationFrame(raf);
}
function play(){
  if(elapsed>=TOTAL){ goTo(0); }
  playing=true; playBtn.textContent='Tạm dừng';
  startPerf=performance.now()-elapsed*1000;
  timer=setInterval(tick,100);
  rafId=requestAnimationFrame(raf);
  if(audioEl){ audioEl.currentTime=elapsed; audioEl.play().catch(()=>{}); }
}
function pause(){
  playing=false; playBtn.textContent='Phát';
  clearInterval(timer); if(rafId) cancelAnimationFrame(rafId);
  if(audioEl) audioEl.pause();
}
function goTo(t){
  elapsed=t; startPerf=performance.now()-t*1000;
  if(audioEl){ audioEl.currentTime=t; if(playing) audioEl.play().catch(()=>{}); }
  loopActive=t>=45.54;
  resetToInit();
  applyTweens(t);
  // Clear every beat's visibility first: showBeat() only removes 'active'
  // from the previously-tracked beat, and a seek invalidates that track.
  BEATS.forEach(b=>document.getElementById(b.id).classList.remove('active','leaving'));
  currentIdx=-1;
  if(loopActive){
    document.getElementById('b7').classList.remove('active');
    document.getElementById('b1').classList.add('active');
    currentIdx=0;
  } else {
    const i=BEATS.findIndex(s=> t>=s.t0 && t < s.t0+s.dur);
    showBeat(i<0?0:i);
  }
  updateMotion(t);
  const ci=CAPTIONS.findIndex(c=> t>=c.t0 && t < c.t1);
  showCaption(ci);
  bar.style.width=(elapsed/TOTAL*100)+'%'; timeEl.textContent=fmt(elapsed)+' / '+fmt(TOTAL);
}
playBtn.onclick=()=> playing?pause():play();
document.getElementById('restartBtn').onclick=()=>{ goTo(0); play(); };
document.getElementById('progress').onclick=function(e){ const r=this.getBoundingClientRect(); goTo((e.clientX-r.left)/r.width*TOTAL); };
if(location.hash==='#export'){ document.body.classList.add('export'); }
// Stage beat 1 at load: its entrance (chips slide 1.5s / blurFade 1.8s)
// runs while the page loads, so the first recorded frame is the full
// composition — chips + "= 0 µs/day" + scale + payoff "11 km / day".
// play() does NOT reset currentIdx, so the entrance is not re-run at the
// click — the scene clock and the voice both start at elapsed=0 with the
// picture already there. (goTo(0) DOES reset currentIdx, so a manual
// restart re-runs the entrance — correct.)
resetToInit();
showBeat(0);
showCaption(0); // stage the first caption at load so frame 1 of the export
                // already carries it (the first tick only fires ~100ms in)
timeEl.textContent='0:00 / '+fmt(TOTAL);
</script>
</body>
</html>
